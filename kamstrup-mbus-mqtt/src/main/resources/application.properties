# ---- Serial / M-Bus ----
mbus.port=/dev/ttyUSB0
mbus.baud=2400
mbus.address=254
mbus.poll-interval-ms=5000

# ---- MQTT via SmallRye Reactive Messaging ----
mp.messaging.outgoing.mbus.connector=smallrye-mqtt
mp.messaging.outgoing.mbus.host=localhost
mp.messaging.outgoing.mbus.port=1883
mp.messaging.outgoing.mbus.topic=kamstrup/mbus
mp.messaging.outgoing.mbus.qos=1
# mp.messaging.outgoing.mbus.username=...
# mp.messaging.outgoing.mbus.password=...

quarkus.smallrye-health.root-path=/q/health