<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Kamstrup M-Bus Live</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .box { border: 1px solid #ccc; padding: 12px; margin: 12px 0; }
    .muted { color: #666; }
    pre { white-space: pre-wrap; word-break: break-word; background: #f5f5f5; padding: 8px; }
    ul { margin: 6px 0 0 18px; }
  </style>
</head>
<body>
  <h1>Kamstrup M-Bus Live</h1>
  <p class="muted">Auto-Refresh alle 2 Sekunden · REST: <code>/api/last</code></p>

  <div class="box">
    <div><b>Status:</b> <span id="status">Lade…</span></div>
  </div>

  <div class="box">
    <div><b>Timestamp:</b> <span id="ts">—</span></div>
    <div><b>Meter ID:</b> <span id="meterId">—</span></div>
    <div><b>Hersteller:</b> <span id="manufacturer">—</span></div>
    <div><b>Primary:</b> <span id="primary">—</span></div>
    <div><b>Volumen (m³):</b> <span id="volume">—</span></div>
    <div><b>Wassertemperatur (°C):</b> <span id="waterTemp">—</span></div>
    <div><b>Umgebungstemperatur (°C):</b> <span id="ambientTemp">—</span></div>
    <div><b>Access#:</b> <span id="accessNumber">—</span></div>
    <div><b>Status Hex:</b> <span id="statusHex">—</span></div>
  </div>

  <div class="box">
    <div><b>Aktive InfoCodes:</b></div>
    <div id="infoNone" class="muted">—</div>
    <ul id="infoList"></ul>
  </div>

  <div class="box">
    <div><b>Raw Frame:</b></div>
    <pre id="rawFrame">—</pre>
  </div>

  <script>
    function setText(id, value) {
      var el = document.getElementById(id);
      el.textContent = (value === null || value === undefined || value === "") ? "—" : String(value);
    }

    function toStatusHex(v) {
      if (v === null || v === undefined) return "—";
      var n = Number(v);
      if (Number.isNaN(n)) return "—";
      var h = n.toString(16).toUpperCase();
      if (h.length < 2) h = "0" + h;
      return "0x" + h;
    }

    function clearInfoCodes() {
      document.getElementById("infoList").innerHTML = "";
      document.getElementById("infoNone").textContent = "Keine aktiven InfoCodes";
    }

    function renderInfoCodes(infoCodes) {
      var list = document.getElementById("infoList");
      list.innerHTML = "";

      if (!Array.isArray(infoCodes) || infoCodes.length === 0) {
        document.getElementById("infoNone").textContent = "Keine aktiven InfoCodes";
        return;
      }

      var active = [];
      for (var i = 0; i < infoCodes.length; i++) {
        var c = infoCodes[i];
        if (c && c.active) active.push(c);
      }

      if (active.length === 0) {
        document.getElementById("infoNone").textContent = "Keine aktiven InfoCodes";
        return;
      }

      document.getElementById("infoNone").textContent = "";

      for (var j = 0; j < active.length; j++) {
        var x = active[j];
        var li = document.createElement("li");
        // bewusst ohne innerHTML / Template-Strings: nur textContent
        var text = x.name + " - " + x.description + " (Std: " + x.hoursActiveLast30Days + ")";
        li.textContent = text;
        list.appendChild(li);
      }
    }

    function setStatus(text) {
      setText("status", text);
    }

    function setNoData() {
      setStatus("Keine Daten");
      setText("ts", null);
      setText("meterId", null);
      setText("manufacturer", null);
      setText("primary", null);
      setText("volume", null);
      setText("waterTemp", null);
      setText("ambientTemp", null);
      setText("accessNumber", null);
      setText("statusHex", null);
      setText("rawFrame", null);
      clearInfoCodes();
    }

    function setError() {
      setStatus("Fehler beim Laden");
    }

    async function load() {
      try {
        var res = await fetch("/api/last", { cache: "no-store" });

        if (res.status === 204) {
          setNoData();
          return;
        }

        var r = await res.json();

        setStatus("OK");

        setText("ts", r.ts);
        setText("meterId", r.meterIdBcd);
        setText("manufacturer", r.manufacturer);
        setText("primary", r.primaryAddress);
        setText("volume", r.volumeM3);
        setText("waterTemp", r.waterTempC);
        setText("ambientTemp", r.ambientTempC);
        setText("accessNumber", r.accessNumber);
        setText("statusHex", toStatusHex(r.status));
        setText("rawFrame", r.rawFrameHex);

        renderInfoCodes(r.infoCodes);

      } catch (e) {
        setError();
      }
    }

    load();
    setInterval(load, 2000);
  </script>
</body>
</html>
